name: Fetch issue sources

# Cloud sessions cannot reach spiritofislam.co.in or R2 directly, so this job
# fetches the PDFs named in sources/request.txt and offers them as an Actions
# artifact (kept 3 days, never committed to git).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources/request.txt]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the requested PDFs
        run: |
          mkdir -p out
          python3 - <<'PY'
          import csv, urllib.request, os
          want = [l.strip() for l in open("sources/request.txt") if l.strip() and not l.startswith("#")]
          rows = {r["file"]: r["url"] for r in csv.DictReader(open("inventory/inventory-pdfs.csv", encoding="utf-8"))}
          for name in want:
              url = rows.get(name)
              if not url or not url.startswith("https://spiritofislam.co.in/wp-content/uploads/"):
                  print("NOT IN INVENTORY:", name); continue
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Macintosh) SOI-archive-fetcher"})
              with urllib.request.urlopen(req, timeout=300) as r, open(os.path.join("out", name), "wb") as f:
                  while chunk := r.read(1 << 20):
                      f.write(chunk)
              print(name, os.path.getsize(os.path.join("out", name)))
          PY
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: issue-sources
          path: out
          retention-days: 3
          compression-level: 0
