name: Build the website

# Builds the static site (dist/) with its Pagefind search index, keeps it as a
# downloadable artifact and, when the repository secret CLOUDFLARE_API_TOKEN
# exists (a token with "Cloudflare Pages: Edit"), publishes it as the Cloudflare
# Pages project "soi-preview"  ->  https://soi-preview.pages.dev  (a preview
# address only; the real domain is not touched).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "issues/*/SOI-*-complete.html", ".github/workflows/soi-site.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "pagefind[bin]"
      - run: python3 site/build_site.py
      - name: Test the pages against the approved design
        run: |
          pip install -q playwright
          python3 -m playwright install --with-deps chromium >/dev/null
          python3 site/tests/test_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: soi-site
          path: dist
          retention-days: 14
      - name: Publish the preview on Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set - site built but not published"; exit 0
          fi
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt      # a preview: keep it out of search engines
          npx --yes wrangler@4 pages project create soi-preview --production-branch main || true
          npx --yes wrangler@4 pages deploy dist --project-name soi-preview --branch main --commit-dirty=true | tee deploy.log
          echo "### Preview published" >> "$GITHUB_STEP_SUMMARY"
          grep -o 'https://[a-z0-9.-]*pages.dev' deploy.log | sort -u >> "$GITHUB_STEP_SUMMARY"
      - name: Check that audio is served from R2
        if: always()
        run: |
          sleep 20
          f=$(ls issues/*/audio.json | xargs grep -l '"/media/audio' | head -1)
          [ -z "$f" ] && { echo "no R2 audio yet"; exit 0; }
          u=$(python3 -c "import json,sys; a=json.load(open('$f')); print(next(v['url'] for v in a.values() if v['url'].startswith('/media/')))")
          echo "testing $u"
          curl -sS -o /dev/null -w "full: %{http_code} %{content_type} %{size_download} bytes\n" "https://soi-preview.pages.dev$u"
          curl -sS -o /dev/null -w "range: %{http_code} %{size_download} bytes\n" -H "Range: bytes=1000-1999" "https://soi-preview.pages.dev$u"
