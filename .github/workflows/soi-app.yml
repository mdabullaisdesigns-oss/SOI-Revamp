name: Build SOI Android app (test APK)

# Builds the website, packs it into the Capacitor app and produces a debug APK you can install on an
# Android phone for testing (Actions → this run → Artifacts → soi-app-debug). Nothing is published.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/soi-app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/soi-app.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build the website
        run: |
          pip install "pagefind[bin]"
          python3 site/build_site.py
      - name: Pack it for the app
        working-directory: app
        run: |
          npm ci
          python3 build_app.py
          npx cap sync android
      - name: Test the packed files (screens, reading, mini player, offline audio, accessibility)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 app/tests/test_app.py
      - name: Screenshots at 375x812 and 412x915, light and dark
        run: python3 app/tests/shots.py "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        with:
          name: soi-app-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 14
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: soi-app-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
