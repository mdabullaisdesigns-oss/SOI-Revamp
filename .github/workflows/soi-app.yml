name: Build SOI Android app (test APK)

# Builds the website, packs it into the Capacitor app and produces a debug APK you can install on an
# Android phone for testing. Shortcuts (no GitHub digging):
#  - live preview in any phone browser: https://soi-app-preview.pages.dev (same screens as the app)
#  - newest test APK, always at the same link: …/releases/download/app-test/soi-app-debug.apk
# google-services.json (Firebase) comes from the secret GOOGLE_SERVICES_JSON and is never committed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "site/site.js", "site/site.css", ".github/workflows/soi-app.yml"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build the website
        run: |
          pip install "pagefind[bin]"
          python3 site/build_site.py
      - name: Pack it for the app
        working-directory: app
        run: |
          npm ci
          python3 build_app.py
          npx cap sync android
      - name: Firebase file from the secret (not in git)
        env: { GS: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          if [ -n "$GS" ]; then printf '%s' "$GS" > app/android/app/google-services.json; echo "google-services.json written"; else echo "::notice::GOOGLE_SERVICES_JSON not set - building without Firebase"; fi
      - name: Live preview of the app screens (soi-app-preview.pages.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::no Cloudflare token - preview skipped"; exit 0; fi
          npx --yes wrangler@4 pages project create soi-app-preview --production-branch main || true
          npx --yes wrangler@4 pages deploy app/www --project-name soi-app-preview --branch main --commit-dirty=true
      - name: Test the packed files (offline reading, links, search)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 app/tests/test_app.py
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: soi-app-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Put the APK at a fixed download link
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk soi-app-debug.apk
          gh release view app-test >/dev/null 2>&1 || gh release create app-test --prerelease --title "SOI app – test build" --notes "Newest test APK (debug). Not for the stores."
          gh release upload app-test soi-app-debug.apk --clobber
