name: Listen to existing audio

# For the issues that already have Gary audio on the site: downloads each MP3
# named in issues/<slug>/audio-source.json, writes down the spoken words with
# their times (issues/<slug>/audio-raw/), and commits them.  MP3s never enter git.
# Runs when sources/audio-request.txt changes (one issue slug per line).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources/audio-request.txt]

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.s.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: echo "slugs=$(grep -v '^#' sources/audio-request.txt | awk 'NF{print $1}' | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"
  listen:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        slug: ${{ fromJson(needs.list.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q faster-whisper
      - run: python3 pipeline/transcribe.py "${{ matrix.slug }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "issues/${{ matrix.slug }}/audio-raw"
          git diff --cached --quiet && exit 0
          git commit -q -m "Spoken words of the existing audio: ${{ matrix.slug }}"
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
