name: Fetch site pages

# Copies the WordPress pages listed in sources/pages.txt into sources/pages/<id>.json
# (cloud sessions cannot reach spiritofislam.co.in themselves).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources/pages.txt]

permissions:
  contents: write

concurrency: soi-fetch-pages

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download pages
        run: |
          mkdir -p sources/pages
          grep -v '^#' sources/pages.txt | grep -E '^[0-9]+$' | while read -r id; do
            echo "== page $id"
            curl -fsSL -A "Mozilla/5.0 (Macintosh) SOI-archive-fetcher" \
              "https://spiritofislam.co.in/?rest_route=/wp/v2/pages/$id&_fields=id,date,modified,link,title,content" \
              -o "sources/pages/$id.json"
            curl -fsSL -A "Mozilla/5.0 (Macintosh) SOI-archive-fetcher" \
              "https://spiritofislam.co.in/?page_id=$id" -o "sources/pages/$id.html" || true
            ls -la "sources/pages/$id."*
            sleep 1
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add sources/pages
          git diff --cached --quiet || git commit -m "Fetch site pages"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
