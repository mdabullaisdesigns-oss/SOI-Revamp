name: Fetch SOI brand assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download header images from the live site
        run: |
          mkdir -p site/brand
          for f in Peogen-logo.png Spirit-of-Islam-Logo.png Slogan-Line.png World-map.svg; do
            curl -fsSL -A "Mozilla/5.0 SOI" "https://spiritofislam.co.in/wp-content/uploads/2026/09/$f" -o "site/brand/$f"
          done
          ls -la site/brand
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/brand
          git diff --cached --quiet || git commit -m "Add SOI header brand assets"
          git push
